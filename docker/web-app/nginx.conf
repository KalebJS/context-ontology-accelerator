# Web app nginx — serves the SPA and proxies API + SSE streams.
# Browser-facing endpoints stay on the same origin so no CORS setup is needed:
#   /api/*    → local-gateway (management + data plane)
#   /invocations → context-manager (Playground SSE)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Management API (Smithy ControlPlaneService) → gateway
    location /api/ {
        proxy_pass http://gateway:9090/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Playground SSE — streamed from the CM's /invocations endpoint.
    # Long read timeout: deep-reasoning queries can run for minutes.
    location /invocations {
        proxy_pass http://context-manager:8080/invocations;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_set_header Host $host;
    }

    # Static assets
    location ~* \.(js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
